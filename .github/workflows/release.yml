name: Release images

# Builds backend + frontend for linux/amd64 and linux/arm64 on native runners
# (no QEMU: an emulated Rust release build takes ages), then joins each pair
# into one multi-arch tag, so `docker compose pull` gets the right image on
# x86 servers, Apple Silicon, Raspberry Pi, Graviton, etc.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build, e.g. v1.2.0
        required: true
      latest:
        description: Also move the `latest` tag to it
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # A tag that pins SurrealDB 3.x ships only after a bridge release with the
  # upgrade hook (docs/releasing.md).
  release-order:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Bind checked-out source to the signing identity
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: bash scripts/ci/check-release-order.sh "$TAG"
      # this tag's own update test started from the release before it (a rebuild of an older tag has no such check)
      - if: github.event_name == 'push'
        run: bash scripts/ci/check-update-path-rows.sh "$TAG"

  build:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    needs: release-order
    strategy:
      matrix:
        image: [backend, frontend, backup, secrets-helper]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: build
        with:
          # backup is a small image that lives under backend/scripts; secrets-helper is ./secrets-helper.
          context: ${{ matrix.image == 'backup' && './backend/scripts/backup' || format('./{0}', matrix.image) }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false # plain per-arch manifests, so they can be joined below
          build-args: APP_VERSION=${{ env.TAG }}
          build-contexts: docs=./docs
          tags: ghcr.io/cashara-io/eunomia-${{ matrix.image }}:${{ env.TAG }}-${{ matrix.arch }}

      - run: python3 scripts/ci/security-tools.py syft
      - name: Generate image SBOM
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 scripts/ci/security-sbom.py image "$IMAGE.cdx.json" "$IMAGE" "registry:ghcr.io/cashara-io/eunomia-$IMAGE@$DIGEST"
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/cashara-io/eunomia-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/cashara-io/eunomia-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ matrix.image }}.cdx.json
          push-to-registry: true

  manifest:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [backend, frontend, backup, secrets-helper]
    steps:
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TAG }}
      - run: python3 scripts/ci/security-tools.py syft
      - name: Join amd64 + arm64 into one tag
        id: manifest
        env:
          IMAGE: ghcr.io/cashara-io/eunomia-${{ matrix.image }}
          LATEST: ${{ github.event_name == 'push' || inputs.latest }}
        run: |
          tags=(-t "$IMAGE:$TAG")
          [ "$LATEST" = "true" ] && tags+=(-t "$IMAGE:latest")
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG"
          digest="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Inventory both architecture digests from the manifest
        env:
          IMAGE: ghcr.io/cashara-io/eunomia-${{ matrix.image }}
          NAME: ${{ matrix.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > manifest.json
          for arch in amd64 arm64; do
            child="$(jq -er --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' manifest.json)"
            [[ "$child" =~ ^sha256:[0-9a-f]{64}$ ]]
            python3 scripts/ci/security-sbom.py image "$arch.cdx.json" "$NAME" "registry:$IMAGE@$child"
          done
          python3 scripts/ci/security-sbom.py merge manifest.cdx.json "$IMAGE@$DIGEST" amd64.cdx.json arm64.cdx.json
      - name: Attest manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/cashara-io/eunomia-${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Attest manifest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/cashara-io/eunomia-${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: manifest.cdx.json
          push-to-registry: true
