name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Tests run against an in-memory SurrealDB, so no service container is
      # needed.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: backend-tests

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run
      # No separate `cargo build --release`: the e2e job builds the release image.

  # The same suite under the hardened server settings, in parallel with `backend`.
  backend-hardened:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: backend-tests
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # The whole suite under the --allow-funcs list read out of docker-compose.yml.
      - run: TEST_HARDENED=1 cargo nextest run
      # The isolation proof with the application-level owner/vault filters switched off.
      - run: ISOLATION_TEST_NO_APP_FILTERS=1 cargo nextest run --test isolation
      # Exactly-once job claims from 4 separate processes on one real RocksDB-backed SurrealDB 3.3.1,
      # started with the hardened flags of docker-compose.yml (the test skips itself without
      # TEST_SURREAL_URL, so the runs above only compile it). docs/architecture/jobs.md.
      - name: Job claims across processes (real SurrealDB)
        run: |
          docker run -d --name fw-claim-db --user root -p 127.0.0.1:8231:8000 surrealdb/surrealdb:v3.3.1 start \
            --user root --pass root --deny-all --allow-rpc --allow-http --allow-arbitrary-query=system \
            --allow-funcs=time,string,search,count,array,vector,math,file,type::file --allow-experimental=files rocksdb:/data/db
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8231/health >/dev/null && break; sleep 1; done
          TEST_SURREAL_URL=ws://127.0.0.1:8231/rpc cargo test --test jobs job_claims_across_processes -- --nocapture

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
      # The committed client in src/lib/gen must match backend/openapi.json.
      - name: API client is up to date
        run: |
          bun run gen:api
          git diff --exit-code -- src/lib/gen
          test -z "$(git status --porcelain -- src/lib/gen)"
      - run: bun run lint
      # `next build` generates `.next/types/*.d.ts`, which `next-env.d.ts`
      # references and tsconfig.json includes -- both are gitignored
      # (Next.js regenerates them), so a fresh checkout has neither until
      # something runs Next at least once. Build first, then re-typecheck.
      - run: bun run build
      - run: bunx tsc --noEmit

  e2e:
    # Runs alongside the test jobs: it builds its own images, so waiting for them only adds time.
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker compose -p eunomia-ci build

      # Throwaway secrets, generated fresh for every run. docker-compose.ci.yml publishes
      # SurrealDB on 127.0.0.1:8000 so the memory-correctness spec can seed SQL fixtures.
      - name: Start stack
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> .env
          # The connectors spec points connectors at its in-test mock provider.
          echo "EUNOMIA_ALLOW_CONNECTOR_BASE_URL=1" >> .env
          # the suite registers many users a minute from one address
          printf "RATE_LIMIT_AUTH_PER_MIN=1000\nRATE_LIMIT_USER_PER_MIN=100000\nRATE_LIMIT_TOKEN_PER_MIN=100000\n" >> .env
          # The backend writes https.json here and the HTTPS spec plays the updater.
          mkdir -p update-status && chmod 777 update-status
          echo "E2E_UPDATE_STATUS_DIR=$PWD/update-status" >> "$GITHUB_ENV"
          docker compose -p eunomia-ci -f docker-compose.yml -f docker-compose.ci.yml up -d backend frontend

      - name: Wait for backend and frontend
        run: |
          for url in http://localhost:8001/healthz http://localhost:3000; do
            for _ in $(seq 1 60); do
              if curl -fsS -o /dev/null "$url"; then
                echo "$url is up"
                continue 2
              fi
              sleep 2
            done
            echo "$url did not become ready" >&2
            docker compose -p eunomia-ci logs --no-color
            exit 1
          done

      # The first user of an install is its instance admin. Register one before any spec runs
      # (generated password) and find the org database it got, for the SQL-fixture tests.
      - name: Create the e2e admin
        run: |
          bash scripts/ci/e2e-setup.sh > "$RUNNER_TEMP/e2e.env"
          echo "::add-mask::$(sed -n 's/^E2E_ADMIN_PASSWORD=//p' "$RUNNER_TEMP/e2e.env")"
          cat "$RUNNER_TEMP/e2e.env" >> "$GITHUB_ENV"
          echo "E2E_SURREAL_HTTP=http://127.0.0.1:8000" >> "$GITHUB_ENV"
          # in-test mock servers listen on the runner; the backend container reaches them via the host gateway
          echo "E2E_MOCK_BIND=0.0.0.0" >> "$GITHUB_ENV"
          echo "E2E_MOCK_HOST=host.docker.internal" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bunx playwright install --with-deps chromium
        working-directory: frontend

      # E2E_BASE_URL points Playwright at the running compose frontend
      # instead of starting `bun run dev`. CI=true turns on trace: retain-on-failure.
      - run: bunx playwright test
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recall-eval
          path: frontend/test-results/**/recall-eval.json
          if-no-files-found: ignore

      - name: Stack logs
        if: failure()
        run: docker compose -p eunomia-ci logs --no-color > stack.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            stack.log
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: docker compose -p eunomia-ci -f docker-compose.yml -f docker-compose.ci.yml down -v

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # connect-agents.sh against a throwaway HOME and a mock API, with jq and
      # again with the python3 fallback.
      - run: CONNECT_JSON=py bash scripts/tests/connect-agents.test.sh
      # Every script test that needs no Docker, by glob so a new one cannot be forgotten.
      # SKIP lists the ones that need real containers (upgrade-surreal-v3 has its own job below).
      - run: |
          SKIP="upgrade-surreal-v3.test.sh"
          rc=0
          for t in scripts/tests/*.test.sh; do
            case " $SKIP " in *" $(basename "$t") "*) echo "skip $t"; continue ;; esac
            echo "== $t"; bash "$t" || rc=1
          done
          exit $rc
      - run: bash -n scripts/*.sh scripts/ci/*.sh scripts/tests/*.sh backend/scripts/backup/eunomia-backup.sh
      # create-eunomia ships a copy of connect-agents.sh, so it is tested here: build (which copies the
      # script in), then format, init and sync tests against an in-test fake server. Node 18 is its floor.
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci && npm test
        working-directory: cli/create-eunomia

  # Real SurrealDB 2.7 -> 3.3 data move (scripts/upgrade-surreal-v3.sh), including a
  # forced mismatch that must roll back, and an upgrade from the released v1.2.2
  # compose file (surrealdb:v2.3, no backup service). Throwaway compose project fw-upgrade.
  upgrade-surreal-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # case B reads the released v1.2.2 compose file from its tag
      - run: bash scripts/tests/upgrade-surreal-v3.test.sh

  # Backups really restore, on a throwaway SurrealDB 3.3.1 container. The two drills share the
  # container name fw-backup-db and port 8211, so they run one after the other.
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/restore-drill.sh
      - run: bash scripts/restore-drill-tenancy.sh
