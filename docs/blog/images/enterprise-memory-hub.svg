<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d" font-family="Geist, Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="t">One memory layer for every internal AI tool</title>
<desc id="d">On the left, what a company knows: staff and decisions, docs and policies, email and calendars, tickets and code. They flow into Eunomia, which can recall, reflect and remember over MCP, REST or the SDK. On the right, what uses it: internal assistants, support and ops agents, coding agents and your own apps. Along the bottom, the controls: a vault per team, scoped tokens, an audit log and self-hosting.</desc>
