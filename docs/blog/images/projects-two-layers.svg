<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="t d" font-family="Geist, Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Two layers of memory for a software team</title>
<desc id="d">Coding agents such as Claude Code, Codex and Cursor read the repo's .eunomia folder first. It holds an index, decisions and a link. A live WebSocket link joins it to Eunomia Cloud: decisions go up to the team vault, context comes down from the company, team and customer vaults.</desc>
