<title id="t">Digital twins: a living model of the whole business</title>
<desc id="d">A line-drawn 3D platform holding a supermarket chain: a farm, a distribution centre, a truck, a store, pallets, an operations lead and a supplier contract, joined by dashed relations. The truck is marked as the bottleneck.</desc>
