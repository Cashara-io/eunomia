<title id="t">Asking the digital twin a what-if question</title>
<desc id="d">Two line-drawn 3D platforms of the same supermarket chain. Today, the transport bar is tallest: trucks wait at the dock. In the what-if, with one extra early truck run, the transport and stores bars are much shorter.</desc>
