<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="t d" font-family="Geist, Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="t">A supermarket supply chain modelled as one ontology</title>
<desc id="d">Four stages, farms, distribution centres, transport and stores, each with inputs and outputs. Transport is the bottleneck. A demand signal runs from stores back to farms. Every stage writes to one Eunomia ontology vault, which lists each entity, its kind, what Eunomia remembers about it, and its status.</desc>
