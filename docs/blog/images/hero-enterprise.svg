<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d" font-family="Geist, Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Enterprise AI needs a memory, not another chatbot</title>
<desc id="d">A card shows internal assistants, support agents and coding agents on top, Eunomia memory in the middle, and docs, email, tickets and code underneath, all under scoped tokens and an audit log.</desc>
<defs><clipPath id="frame"><rect width="1200" height="420" rx="28"/></clipPath></defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="420" fill="#F0F0EB"/>
  <circle cx="1150" cy="40" r="150" fill="#E8BE39"/>
  <path d="M1200 420 L1010 420 A190 190 0 0 1 1200 230z" fill="#3159B6"/>
  <circle cx="640" cy="372" r="20" fill="#CF412F"/>
  <path d="M612 60 L640 110 L584 110z" fill="#171717"/>
  <rect x="1130" y="196" width="34" height="34" fill="#CF412F" transform="rotate(14 1147 213)"/>
  <text x="56" y="76" font-size="20" fill="#171717" letter-spacing="-0.5"><tspan font-weight="600">eunomia</tspan><tspan font-weight="400" fill="#61615D"> enterprise</tspan></text>
  <circle cx="60.5" cy="102.5" r="4.5" fill="#CF412F"/><rect x="67.7" y="98" width="9" height="9" fill="#E8BE39"/><path d="M79.4 107 L83.9 98 L88.4 107z" fill="#3159B6"/>
  <text x="56" y="200" font-size="42" fill="#171717" font-weight="500" text-anchor="start" letter-spacing="-1.6">Enterprise AI needs a memory,</text>
<text x="56" y="252" font-size="42" fill="#171717" font-weight="500" text-anchor="start" letter-spacing="-1.6">not another chatbot.</text>
  <text x="56" y="310" font-size="17" fill="#61615D" font-weight="400" text-anchor="start">One memory layer for every internal AI tool.</text>
  <rect x="704" y="92" width="420" height="252" rx="16" fill="#ffffff" stroke="#171717" stroke-width="1.5"/><rect x="728.0" y="78" width="201.4" height="28" rx="14" fill="#171717"/><text x="828.72" y="96.5" font-size="12" fill="#ffffff" font-weight="500" text-anchor="middle">Scoped tokens and audit log</text><rect x="728.0" y="126" width="117.3" height="40" rx="8" fill="#F0F0EB"/><text x="786.6666666666666" y="151" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Assistants</text><rect x="855.3" y="126" width="117.3" height="40" rx="8" fill="#F0F0EB"/><text x="914.0" y="151" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Support agents</text><rect x="982.7" y="126" width="117.3" height="40" rx="8" fill="#F0F0EB"/><text x="1041.3333333333333" y="151" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Coding agents</text><rect x="728.0" y="176" width="372.0" height="40" rx="8" fill="#F0F0EB"/><text x="914.0" y="201" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Recall, reflect, remember</text><rect x="728.0" y="226" width="372.0" height="40" rx="8" fill="#3159B6"/><text x="914.0" y="251" font-size="14" fill="#ffffff" font-weight="500" text-anchor="middle">Eunomia memory</text><rect x="728.0" y="276" width="85.5" height="40" rx="8" fill="#F0F0EB"/><text x="770.75" y="301" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Docs</text><rect x="823.5" y="276" width="85.5" height="40" rx="8" fill="#F0F0EB"/><text x="866.25" y="301" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Email</text><rect x="919.0" y="276" width="85.5" height="40" rx="8" fill="#F0F0EB"/><text x="961.75" y="301" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Tickets</text><rect x="1014.5" y="276" width="85.5" height="40" rx="8" fill="#F0F0EB"/><text x="1057.25" y="301" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Code</text>
</g>
