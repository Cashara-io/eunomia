services:
  surrealdb:
    # come back after a crash or reboot, like the backend
    restart: unless-stopped
    # Exact patch pin; upgrade deliberately. Hardened: every
    # capability is denied except the function families the backend's SQL uses
    # (docs/architecture/surreal-functions.md), guests are refused, and a runaway query or
    # transaction is cut off. tests run the suite under the same --allow-funcs list.
    image: surrealdb/surrealdb:v3.3.5
    user: root
    entrypoint:
      - /surreal
      - start
      - --user
      - ${SURREAL_USER:-root}
      - --pass
      - ${SURREAL_PASS:-root}
      - --deny-all
      # --deny-all also refuses guests (adding --deny-guests is a startup error on 3.3.1 and 3.3.5) but denies RPC,
      # HTTP and root queries too: allow those explicitly. Verified on live 3.3.1 and 3.3.5 servers.
      - --allow-rpc
      - --allow-http
      - --allow-arbitrary-query=system
      # file and type::file: the documents bucket (file::put/get/delete on type::file pointers)
      - --allow-funcs=time,string,search,count,array,vector,math,file,type::file
      # file buckets are experimental in 3.3; write it with `=`, the flag takes several values and
      # would swallow the database path below (docs/documents.md)
      - --allow-experimental=files
      - --query-timeout=60s
      - --transaction-timeout=60s
      - rocksdb:/data/eunomia.db
    environment:
      # the only folder a `file:` bucket may use: uploaded documents (EUNOMIA_DOCUMENTS_BACKEND), kept in
      # the database's own data volume, so documents need no other service or volume
      - SURREAL_BUCKET_FOLDER_ALLOWLIST=/data/documents
    # No host port: only the backend talks to the DB, over the compose network.
    volumes:
      # 3.x data lives on eunomia-surreal-data-v3. An install from before 2.0 keeps its 2.x data
      # on eunomia-surreal-data, which is never opened by 3.x: surreal-upgrade (below) copies it
      # across first and records SURREAL_DATA_VOLUME in .env.
      - ${SURREAL_DATA_VOLUME:-eunomia-surreal-data-v3}:/data
    depends_on:
      surreal-upgrade:
        condition: service_completed_successfully
    healthcheck:
      # ws, not http: under --deny-all, isready over http fails with "Method not allowed" while the
      # server is fine, and the backend (service_healthy) then never starts after an update
      test: ["CMD", "/surreal", "isready", "--endpoint", "ws://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot, run by every `docker compose up` before surrealdb starts: moves an install's
  # SurrealDB 2.x data to 3.x when it has some that was never moved, so a 1.x install that jumps
  # straight to this release (its old updater just runs `up`) is migrated, not crash-looped.
  # A no-op within a second otherwise. On failure it exits 1 and the old server and backend run
  # again on the untouched old volume. See scripts/surreal-upgrade-service.sh and
  # docs/upgrading-to-surrealdb-3.md. Holds the docker socket like the updater; no ports.
  surreal-upgrade:
    image: docker:27-cli
    restart: "no"
    entrypoint: ["sh", "/eunomia/scripts/surreal-upgrade-service.sh"]
    volumes:
      - .:/eunomia
      - /var/run/docker.sock:/var/run/docker.sock

  backend:
    image: ghcr.io/cashara-io/eunomia-backend:${EUNOMIA_IMAGE_TAG:-latest}
    build:
      context: ./backend
      additional_contexts:
        docs: ./docs
    restart: always
    ports:
      # Loopback only: local agents use http://localhost:8001. Browsers and remote agents go
      # through the frontend (:3000), whose address the backend trusts for X-Forwarded-For.
      # Set BACKEND_BIND=0.0.0.0 to expose it on the LAN (traffic then skips the proxy chain).
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8001}:8001"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASS=${SURREAL_PASS:-root}
      - SURREAL_NS=${SURREAL_NS:-eunomia}
      - SURREAL_DB=${SURREAL_DB:-eunomia}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-}
      - EMBEDDINGS_BACKEND=${EMBEDDINGS_BACKEND:-openai}
      - CORS_ALLOWED_ORIGINS=${FRONTEND_URL:-http://localhost:3000}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8001}
      - SESSION_TTL_DAYS=${SESSION_TTL_DAYS:-30}
      - RATE_LIMIT_USER_PER_MIN=${RATE_LIMIT_USER_PER_MIN:-1200}
      - RATE_LIMIT_TOKEN_PER_MIN=${RATE_LIMIT_TOKEN_PER_MIN:-600}
      - RATE_LIMIT_AUTH_PER_MIN=${RATE_LIMIT_AUTH_PER_MIN:-20}
      # the frontend service (resolved by name, re-resolved every minute): the only peer whose X-Forwarded-For is believed
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-frontend}
      - RATE_LIMIT_WEBHOOK_PER_MIN=${RATE_LIMIT_WEBHOOK_PER_MIN:-120}
      - RATE_LIMIT_REFRESH_PER_MIN=${RATE_LIMIT_REFRESH_PER_MIN:-300}
      - SIGNUP=${SIGNUP:-open}
      - SIGNUP_ALLOWLIST=${SIGNUP_ALLOWLIST:-}
      - EUNOMIA_SIGNUP_ORG=${EUNOMIA_SIGNUP_ORG:-join}
      - AUTH_MODE=${AUTH_MODE:-password}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-}
      - OIDC_PROVIDER_NAME=${OIDC_PROVIDER_NAME:-}
      - EUNOMIA_ADMIN_EMAILS=${EUNOMIA_ADMIN_EMAILS:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-auto}
      - CAPSULE_ARGS=${CAPSULE_ARGS:-off}
      - ALLOW_PRIVATE_LLM_URL=${ALLOW_PRIVATE_LLM_URL:-1}
      - EUNOMIA_ALLOW_CONNECTOR_BASE_URL=${EUNOMIA_ALLOW_CONNECTOR_BASE_URL:-0}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-365}
      - TOOL_USAGE_RETENTION_DAYS=${TOOL_USAGE_RETENTION_DAYS:-90}
      - SESSION_RETENTION_DAYS=${SESSION_RETENTION_DAYS:-7}
      - ENCRYPTION_KEY_LEGACY_EMPTY=${ENCRYPTION_KEY_LEGACY_EMPTY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=eunomia-backend
      # where SurrealDB's built-in file bucket keeps uploaded documents: by default a folder in its own
      # data volume. Optionally an S3 URL, with the credentials in the surrealdb service's environment
      # (docs/documents.md)
      - EUNOMIA_DOCUMENTS_BACKEND=${EUNOMIA_DOCUMENTS_BACKEND:-file:/data/documents}
      - EUNOMIA_DOCUMENTS_MAX_BYTES=${EUNOMIA_DOCUMENTS_MAX_BYTES:-26214400}
    # Read/write access to ONE small status directory -- not the repo, not
    # the docker socket. The `updater` service below does the actual update.
    volumes:
      - ./update-status:/update-status
    depends_on:
      surrealdb:
        condition: service_healthy
    healthcheck:
      # /readyz checks the control database and its migrations, not just the process.
      # start_period covers a first boot that moves an old install into its org database.
      test: ["CMD", "curl", "-f", "http://localhost:8001/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30m

  frontend:
    # come back after a crash or reboot, like the backend
    restart: unless-stopped
    image: ghcr.io/cashara-io/eunomia-frontend:${EUNOMIA_IMAGE_TAG:-latest}
    build: ./frontend
    ports:
      # Set FRONTEND_BIND=127.0.0.1 when a reverse proxy runs on this host (docs/deployment.md).
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    environment:
      # 1 only behind a trusted reverse proxy: believe the X-Forwarded-For/Proto it sets (src/proxy.ts)
      - FRONTEND_TRUST_FORWARDED=${FRONTEND_TRUST_FORWARDED:-}
    depends_on:
      backend:
        condition: service_healthy

  # Applies updates when you click "Update now" in Settings (see
  # scripts/updater.sh). Not web-facing: no ports, its only input is the
  # marker file the backend writes into ./update-status.
  updater:
    image: docker:27-cli
    restart: unless-stopped
    # A changed definition is what gets this release's scripts/updater.sh loaded: the updater of
    # the release being replaced ends every update with `docker compose up -d updater`, which only
    # recreates the container when this block differs (compose cannot see the script itself).
    labels:
      eunomia.updater: "2"
    entrypoint: ["sh", "-c", "cp /eunomia/scripts/updater.sh /tmp/updater.sh && exec sh /tmp/updater.sh"]
    volumes:
      - .:/eunomia
      - /var/run/docker.sock:/var/run/docker.sock

  # HTTPS with a free Let's Encrypt certificate (see ./Caddyfile). Off unless
  # .env has COMPOSE_PROFILES=https plus EUNOMIA_DOMAIN and EUNOMIA_ACME_EMAIL,
  # which the installer's --domain flag or Settings, HTTPS set. It proxies to the
  # frontend only, so the backend still trusts just the frontend (TRUSTED_PROXIES);
  # turning HTTPS on also sets FRONTEND_TRUST_FORWARDED=1 and FRONTEND_BIND=127.0.0.1
  # (see docs/deployment.md).
  caddy:
    image: caddy:2.11.7
    profiles: [https]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - EUNOMIA_DOMAIN=${EUNOMIA_DOMAIN:-}
      - EUNOMIA_ACME_EMAIL=${EUNOMIA_ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - eunomia-caddy-data:/data # certificates: keep them across restarts
      - eunomia-caddy-config:/config
    depends_on:
      - frontend

  # Nightly encrypted SurrealDB export at 03:00 into the eunomia-backups
  # volume (see backend/scripts/backup/). No ports. If BACKUP_ENCRYPTION_KEY is
  # empty it generates a key into the volume on first start (see docs/deployment.md).
  backup:
    image: ghcr.io/cashara-io/eunomia-backup:${EUNOMIA_IMAGE_TAG:-latest}
    build: ./backend/scripts/backup
    restart: unless-stopped
    environment:
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - TZ=${TZ:-UTC}
      - SURREAL_ENDPOINT=http://surrealdb:8000
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASS=${SURREAL_PASS:-root}
      - SURREAL_NS=${SURREAL_NS:-eunomia}
      - SURREAL_DB=${SURREAL_DB:-eunomia}
      - DOCUMENTS_DIR=/surreal-data/documents
    volumes:
      - eunomia-backups:/backups
      # the database's data volume, for the uploaded documents in it (/surreal-data/documents): written
      # into each backup as documents.tar.enc and restored from it. Nothing else in it is touched.
      - ${SURREAL_DATA_VOLUME:-eunomia-surreal-data-v3}:/surreal-data
    depends_on:
      surrealdb:
        condition: service_healthy

volumes:
  eunomia-surreal-data:
  eunomia-surreal-data-v3:
  eunomia-backups:
  eunomia-caddy-data:
  eunomia-caddy-config:
